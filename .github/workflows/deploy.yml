name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Build frontend
        run: npm run build:web:prod

      # D1 migrations must be applied locally before deploying:
      #   npx wrangler d1 migrations apply atletica-db --remote
      # The CI token lacks D1 query permissions. To automate this,
      # regenerate the token with D1 edit permissions included.

      - name: Deploy API
        run: npx wrangler deploy src/api/index.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy frontend
        run: npx wrangler pages deploy dist --project-name=atleticageneve
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
